[project]
name = "vigil"
version = "0.1.0"
description = "Daily cyber-signal brief agent (phase 15c, roster #1)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "jinja2>=3.1.6",
]

[project.scripts]
vigil = "vigil.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]
