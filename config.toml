# vigil config. Secrets (Fastmail app password, OWUI webhook id+token,
# operator personal email, optional NVD API key) live in secrets/*, not here.

[caps]
# Hard limits applied before the Codex prompt — protects the ChatGPT Plus
# context window and forces a tighter brief.
kev = 8
cve = 12
news = 8

[thresholds]
# Inclusion gates for the candidate CVE set.
epss_top_decile = 0.90    # percentile gate
epss_high = 0.50          # absolute EPSS gate
cvss_high = 7.0           # CVSS from any provider (NVD / CNA / ADP)

# EPSS-delta (early warning, v1): absolute increase >= this is a "mover".
# Crossing into the top decile overnight also flags as a mover.
epss_delta = 0.10

[diversity_caps]
# A3: per-source cap applied to candidates AFTER gating, BEFORE the global cve
# cap. KEV-listed and high-EPSS items are exempt. Source labels here must
# match CNA_NAMES in sources/nvd.py (or raw source if not resolved).
# Cap the Linux kernel CNA, which assigns a CVE per bugfix commit and floods
# briefs on quiet days. Other sources stay uncapped here; the global cve cap
# still applies.
"Linux kernel" = 3

[kernel_collapse]
# A4: when 2+ kernel-CNA items end up in the cves section AND are low-EPSS
# AND not KEV-listed, collapse them into a single summary entry instead of
# rendering full individual lines. Set threshold=0 to disable.
threshold = 2
low_epss  = 0.10

[feeds]
# Fourth feed (SANS ISC) is swappable — Unit 42 or Google GTIG/Mandiant are
# the natural vendor-intel alternatives.
rss = [
  "https://krebsonsecurity.com/feed/",
  "https://www.bleepingcomputer.com/feed/",
  "https://feeds.feedburner.com/TheHackersNews",
  "https://isc.sans.edu/rssfeed.xml",
]

[delivery]
# Channel name is load-bearing — referenced by post.py and notify.sh.
# Renaming requires updating both.
channel = "vigil"
# Channel id is needed by listen.py for the bot's REST polling/posting
# (the webhook URL embeds its own id but isn't reusable for reads).
channel_id = "a415b633-8cd4-4017-adba-c96f97bcec28"

[listener]
# How often the listener polls for new operator questions. The spec
# accepts up to ~30s; 25s is a reasonable middle.
poll_seconds = 25
# Max top-level messages fetched per poll (newest-first; client-side filter trims).
fetch_limit = 50
# v1.2.1: also fetch threads of top-level messages whose created_at is
# within this many seconds of now. OWUI's /messages endpoint returns
# top-level only, so without this the listener never sees threaded operator
# replies (e.g. follow-ups posted under the daily brief).
thread_lookback_seconds = 86400
# Content prefixes that identify vigil's own posts (webhook brief +
# notify alerts) so the listener doesn't try to answer them. The notify
# prefix is "[vigil" without the closing bracket so it catches both
# `[vigil]` (brief job) and `[vigil-listener]` (listener-emitted alerts).
own_content_prefixes = ["# vigil", "[vigil"]

[listener.breaker]
# B1: rolling-window post counter. If the listener posts more than
# `threshold` answers in `window_seconds`, it trips: goes inert (keeps
# polling, stops answering) and persists the tripped flag. Reset is
# manual: rm ~/work/agents/vigil/data/listener-breaker.json then restart.
# Numbers sit far above any human Q&A rate; this only catches a loop.
window_seconds = 300
threshold      = 10

[listener.notify]
# B2: how many consecutive loop iterations must raise before notify.sh
# fires for the failure episode. Debounces so a single transient OWUI
# blip doesn't page. Also fires once on circuit-breaker trip.
consecutive_failures = 5

[schedule]
# StartCalendarInterval Hour=3 Minute=30 (machine local PT) == 06:30 ET.
# 03:30 PT clears both DST transition instants; lands on 06:30 ET year-round.
# Operator stated 06:30 Eastern. If 06:30 Pacific was intended, set hour = 6.
hour = 3
minute = 30
